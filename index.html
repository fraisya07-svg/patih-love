<!doctype html>

<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>I Love You — Heart, Star & Moon</title>
  <style>
    :root{ --bg:#0f172a; --accent:#ff5470; --accent-2:#ffd166; --soft:#8aa0ff }
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 10% 10%, rgba(138,160,255,0.06), transparent), linear-gradient(180deg,#021028 0%, var(--bg) 60%); color:#fff}
    .stage{width:min(920px,95vw);aspect-ratio:16/9;display:grid;place-items:center;position:relative}/* Card */
.card{width:100%;height:100%;border-radius:20px;padding:28px;box-sizing:border-box;display:flex;gap:24px;align-items:center;justify-content:space-between;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));box-shadow:0 8px 30px rgba(2,6,23,0.6);backdrop-filter: blur(6px)}

/* Left: shapes */
.shapes{display:flex;gap:22px;align-items:center;flex:1;justify-content:center}
svg{width:220px;height:220px;display:block;cursor:pointer;transition:transform .45s cubic-bezier(.2,.9,.3,1)}
svg:hover{transform:translateY(-8px) scale(1.05)}

/* Heart */
.heart path{fill:var(--accent);filter:drop-shadow(0 6px 18px rgba(255,84,112,0.18));}
.heart .shine{fill:rgba(255,255,255,0.18)}

/* Star */
.star polygon{fill:var(--accent-2);filter:drop-shadow(0 6px 20px rgba(255,209,102,0.12));}

/* Moon */
.moon .cres{fill:linear-gradient(#fff,#ddd)}
.moon .base{fill:var(--soft);filter:drop-shadow(0 8px 20px rgba(138,160,255,0.08));}

/* Right: text */
.panel{flex:0 0 360px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
h1{margin:0;font-size:40px;letter-spacing:1px}
p{margin:0;color:#cbd5e1}

.i-love{display:inline-block;padding:8px 18px;border-radius:999px;background:linear-gradient(90deg,var(--accent),#ff7aa2);box-shadow:0 8px 30px rgba(255,84,112,0.18);font-weight:700}

/* Animated text */
.big{font-size:64px;font-weight:800;letter-spacing:2px;color:transparent;background:linear-gradient(90deg,var(--accent),#fff 60%);-webkit-background-clip:text;background-clip:text}

/* Floating animation for svg group */
@keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}}
.shapes svg:nth-child(1){animation:floaty 4s ease-in-out infinite}
.shapes svg:nth-child(2){animation:floaty 5s ease-in-out .4s infinite}
.shapes svg:nth-child(3){animation:floaty 4.6s ease-in-out .2s infinite}

/* small screens */
@media (max-width:880px){.card{flex-direction:column;padding:18px}.panel{width:100%;align-items:center;text-align:center}.shapes{gap:12px}.panel{order:2}.shapes{order:1}}

/* Subtle heart beat when clicked */
.pulse{animation:heartbeat .72s ease both}
@keyframes heartbeat{0%{transform:scale(1)}30%{transform:scale(1.14)}50%{transform:scale(.96)}70%{transform:scale(1.06)}100%{transform:scale(1)}}

  </style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <div class="shapes" role="group" aria-label="Heart, Star, Moon">
        <!-- Heart -->
        <svg class="heart" viewBox="0 0 64 64" aria-hidden="true" title="Heart">
          <defs>
            <linearGradient id="g1" x1="0" x2="1">
              <stop offset="0" stop-color="#ff5a7a"/>
              <stop offset="1" stop-color="#ff8fab"/>
            </linearGradient>
          </defs>
          <path d="M32 54s-20-12.8-26-20.3C.9 23.3 9.9 12 20.5 15c5.4 1.7 7.5 6.8 11.5 8.6 4-1.8 6-6.9 11.5-8.6C54.1 12 63.1 23.3 58 33.7 52 41.2 32 54 32 54z" fill="url(#g1)"/>
          <path class="shine" d="M40 14c-5 3-7.5 7-11 8 2 0 4-1 6-2 3-2 5-5 5-6z" fill="rgba(255,255,255,0.18)"/>
        </svg><!-- Star -->
    <svg class="star" viewBox="0 0 64 64" aria-hidden="true" title="Star">
      <polygon points="32,6 39,25 59,25 42,38 48,57 32,46 16,57 22,38 5,25 25,25" />
    </svg>

    <!-- Moon (crescent) -->
    <svg class="moon" viewBox="0 0 64 64" aria-hidden="true" title="Moon">
      <defs>
        <linearGradient id="m1" x1="0" x2="1">
          <stop offset="0" stop-color="#b3c6ff"/>
          <stop offset="1" stop-color="#8aa0ff"/>
        </linearGradient>
      </defs>
      <circle cx="30" cy="32" r="18" fill="url(#m1)" />
      <circle cx="36" cy="28" r="18" fill="var(--bg)" />
      <g opacity="0.14">
        <circle cx="24" cy="20" r="2" fill="#fff" />
        <circle cx="40" cy="40" r="1.6" fill="#fff" />
        <circle cx="20" cy="36" r="1.2" fill="#fff" />
      </g>
    </svg>
  </div>

  <div class="panel">
    <div>
      <h1 class="big">I LOVE YOU RAISYA</h1>
      <p>Untuk Raisya yang selalu ada di hati — ini khusus buat kamu ❤</p>
    </div>

    <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
      <span class="i-love">Say it with shapes ❤</span>
      <button id="swap" style="padding:10px 14px;border-radius:999px;border:0;background:transparent;color:#cbd5e1;cursor:pointer">Animate</button>
    </div>

    <p style="font-size:12px;color:#94a3b8;margin-top:auto">Klik bentuknya untuk efek. Buka file ini di browser untuk melihat penuh.</p>
  </div>
</div>

  </div>  <script>
    // Interaction: click shapes for different effects
    const heart = document.querySelector('.heart');
    const star = document.querySelector('.star');
    const moon = document.querySelector('.moon');
    heart.addEventListener('click', ()=>{
      heart.classList.add('pulse');
      setTimeout(()=>heart.classList.remove('pulse'),800);
    });

    star.addEventListener('click', ()=>{
      star.animate([
        { transform: 'rotate(0) scale(1)' },
        { transform: 'rotate(20deg) scale(1.08)' },
        { transform: 'rotate(-18deg) scale(1.06)' },
        { transform: 'rotate(0) scale(1)'}
      ], { duration:700, easing:'cubic-bezier(.2,.9,.3,1)' });
    });

    moon.addEventListener('click', ()=>{
      moon.animate([
        { transform: 'translateY(0) rotate(0)' },
        { transform: 'translateY(-12px) rotate(-6deg)' },
        { transform: 'translateY(0) rotate(0)' }
      ], { duration:900, easing:'ease-out'});
    });

    // Button toggles color theme between warm and cool
    const swap = document.getElementById('swap');
    let warm = true;
    swap.addEventListener('click', ()=>{
      document.documentElement.style.setProperty('--accent', warm? '#ffd166' : '#ff5470');
      document.documentElement.style.setProperty('--accent-2', warm? '#9be7ff' : '#ffd166');
      document.documentElement.style.setProperty('--soft', warm? '#ffd1a8' : '#8aa0ff');
      warm = !warm;
    });
  </script></body>
</html>
